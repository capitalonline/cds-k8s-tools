# cds-pod-alarm 联调部署文件（沙箱集群 35ste7，K8s 1.26）
# 用法：kubectl apply -f releases/cds-pod-alarm-ben-dev-1106.yaml
# 回滚：kubectl -n kube-system scale deploy/cds-pod-alarm --replicas=0
#
# 镜像需先构建并推送（本分支代码，不能用 v2.0.0）：
#   docker build --build-arg bin_file=cds-pod-alarm \
#     -t registry-bj.capitalonline.net/cck/cds-pod-alarm:ben-dev-1106-A .
#   docker push registry-bj.capitalonline.net/cck/cds-pod-alarm:ben-dev-1106-A
#
# 注意：DEPLOY_TYPE 写死 pre，网关地址由 pkg/utils/init.go 决定（DEPLOY_TYPE=pre 时连预生产 OpenAPI）。
# 该集群挂的是真实 AK 和真实 cluster_id，pending/terminating 告警会真实发到 pre 一线群。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-alarm-configmap
  namespace: kube-system
data:
  pod-alarm-config: |+
    [default]
    # 检测间隔(秒)
    pod.check.step = 120
    # 监控命名空间，逗号分隔，可多选。【必填】告警和自动删除共用该范围，留空组件启动失败
    pod.monitor.namespaces = default
    # Pending 状态告警阈值(分钟)
    pod.pending.threshold.minutes = 20
    # Terminating 状态告警阈值(分钟)
    pod.terminating.threshold.minutes = 10
    # 自动删除总开关：no=dry-run（只打印"将会强制删除"日志）；确认名单无误后改 yes
    pod.autodelete.enabled = no
    # 告警阈值之外再等待的分钟数，实际删除阈值 = terminating 阈值 + 该值
    pod.autodelete.delay.minutes = 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cds-pod-alarm-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cds-pod-alarm-cluster-role
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cds-pod-alarm-role-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cds-pod-alarm-cluster-role
subjects:
  - kind: ServiceAccount
    name: cds-pod-alarm-sa
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cds-pod-alarm
  namespace: kube-system
  labels:
    app: cds-pod-alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cds-pod-alarm
  template:
    metadata:
      labels:
        app: cds-pod-alarm
    spec:
      serviceAccountName: cds-pod-alarm-sa
      # 1.24+ 集群 master 节点的 label 是 control-plane，原来的 kubernetes.io/master 匹配不到任何节点
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.cck.net/infra"
          effect: NoSchedule
        - key: "node-role.kubernetes.io/master"
          effect: NoSchedule
        # 1.24+ 集群 master 节点的 taint key 变更，缺这条会导致 Pod Pending
        - key: "node-role.kubernetes.io/control-plane"
          effect: NoSchedule
      dnsPolicy: Default
      containers:
        - name: cds-pod-alarm
          image: registry-bj.capitalonline.net/cck/cds-pod-alarm:ben-dev-1106-A
          imagePullPolicy: Always
          env:
            - name: CDS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cck-secrets
                  key: access_key_id
            - name: CDS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: cck-secrets
                  key: access_key_secret
            - name: CDS_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: cds-properties
                  key: k8s_cluster_id
            - name: DEPLOY_TYPE
              value: "pre"
            - name: OPENAPI_IP
              value: "106.3.136.106"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: pod-alarm-config
              mountPath: /pod-alarm/
      volumes:
        - name: pod-alarm-config
          configMap:
            name: pod-alarm-configmap
